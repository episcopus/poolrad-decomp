name: Bug report
description: Something in the rebuild, a port, the maps or a tool does not work as described.
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - The Pascal rebuild (make rebuild)
        - The C translation
        - The CoCo 3 port
        - The maps
        - Another tool or the documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Paste the output as text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, emulator or hardware, and versions.
  - type: checkboxes
    id: files
    attributes:
      label: The game's files
      options:
        - label: I have not attached, linked or pasted any of the game's files.
          required: true
