# The roster `make start-run` launches: one OpenCode session per entry, each in its own iTerm tab,
# started with the matching prompt block of docs/process/START-AGENT.md (`heading` is the text after
# "## The prompt for"). `model` is the OpenCode model id (`opencode models`) and `variant` is its
# reasoning effort, passed as `model#variant` (`high` on every session here); edit freely.
# `make stop-run` drains, integrates, releases and closes exactly these sessions.

[[session]]
name = "orch-sonnet"
role = "orchestrator"
model = "openrouter/anthropic/claude-sonnet-5.5"
variant = "high"
heading = "orchestator sonnet"

