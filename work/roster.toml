# The roster `make start-run` launches, one iTerm tab per entry. Decompilers and reviewers run as
# workers (`make worker`, docs/process/WORKER.md): a supervisor that starts one fresh `opencode run`
# per batch of routines or per review and claims again until the run stops; `heading` is not used for
# them. Every other role is one interactive OpenCode session started with the prompt block of
# docs/process/START-AGENT.md named by `heading` (the text after "## The prompt for"); `mode =
# "interactive"` makes a decompiler or reviewer one too. `model` is the OpenCode model id (`opencode
# models`) and `variant` is its reasoning effort, passed as `model#variant` (`high` on every session
# here). Optional for workers: `batch` (routines per session) and `timeout` (minutes per session).
# `make stop-run` drains, lets workers hand off, integrates, releases and closes exactly these sessions.

[[session]]
name = "orch-sonnet"
role = "orchestrator"
model = "openrouter/anthropic/claude-sonnet-5.5"
variant = "high"
heading = "orchestator sonnet"

[[session]]
name = "dec-deepseek-2"
role = "decompiler"
model = "openrouter/deepseek/deepseek-v4.1-flash"
variant = "high"
heading = "decompiler deepseek 2"

[[session]]
name = "dec-haiku-2"
role = "decompiler"
model = "openrouter/anthropic/claude-haiku-5.5"
variant = "high"
heading = "decompiler haiku 2"

[[session]]
name = "dec-haiku"
role = "decompiler"
model = "openrouter/anthropic/claude-haiku-5.5"
variant = "high"
heading = "decompiler haiku"

[[session]]
