# The roster `make start-run` launches: one OpenCode session per entry, each in its own iTerm tab,
# started with the matching prompt block of docs/process/START-AGENT.md (`heading` is the text after
# "## The prompt for"). `model` is the OpenCode model id (`opencode models`); edit freely.
# `make stop-run` drains, integrates, releases and closes exactly these sessions.

[[session]]
name = "orch-gpt-6-1"
role = "orchestrator"
model = "openai/gpt-6.1-sol"
heading = "orchestator gpt 6.1 sol"

[[session]]
name = "dec-mimo"
role = "decompiler"
model = "openrouter/xiaomi/mimo-v2.6-pro"
heading = "decompiler mimo"

