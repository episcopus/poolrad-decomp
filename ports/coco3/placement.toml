# placement.toml: where the blocks a pointer type points to live in the CoCo port (decision D12, hybrid; step 8.2).
# Read by tools/c/pas2c.py --profile coco --placement. A pointee type (the Pascal type the pointer is declared
# ^TType) is in one of three classes; the default is "engine":
#
#   mapped  hot data, a native 16-bit address in the 64 KB map, read with FPM, allocated from the mapped heap
#   banked  cold data, read with FPB (the block is mapped into the data window first), allocated in physical memory
#   engine  pictures, staging screens, DAX buffers: opaque handles only the engine dereferences (PC heap here).
#           Game logic that dereferences one anyway is listed in placement-report.txt: it needs an engine call.
#
# Chosen from the measurements of docs/PHASE-8.1c.md: references per key by class, live bytes, who touches them.
# Names are matched case-insensitively against the C type name of the pointee.

[mapped]
types = [
  "TCombatNode", "TLineState", "TReturnEntry",
  "TCombatMap", "TMapRows", "TGeoCellBlock", "TBlock400",
  "TVmWords9700",
]

[banked]
types = [
  "TCharacter", "TAffect", "TMenuLine", "TCombatant",   # option 1 of docs/HEAP-STUDY.md: what scales with the size of an encounter (characters, their combat records, affects, items)
  "TScoredCharacter", "TSheetFields", "TAbilityBlock", "TDamageDice", "TResistView",   # typed views of a TCharacter: they follow it
  "TGameVars", "TEclCode", "TVmWords4900", "TVmWords6B00", "TMemPic", "TPictureHeader",
  "TWallTiles", "TWallSets",         # 8.7: 2.3 KB the mapped heap needs for a fight; one block, two typed views (WallSets is absolute WallTiles), so both banked
]

# A field declared as an untyped Pointer that the game uses as a typed list: what it holds, for the allocation
# (GetMem(Who^.Affects, 9) must come from the same class as the TAffect it is read through).
[pointer_fields]
"TCharacter.Affects" = "TAffect"
