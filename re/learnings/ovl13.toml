# Lessons from unit ovl13 (CombatSpells). Leads with evidence, not matcher verdicts.

[[lesson]]
id = "with-temp-odd-offset-named-local"
confidence = "V"
units = ["*"]
tags = ["with", "pointer", "temporary", "frame", "A-", "codegen"]
title = "A with over a pointer puts its hidden temp at an odd offset under $A-"
lesson = "TP 6.0 compiles `with Who^.Combat^ do` by loading the far pointer once into a hidden temp (`les di,es:[di+off]; mov [bp-t],di; mov [bp-t+2],es`) and reloading `les di,[bp-t]` before every field access. The temp sits below the named locals. Under the default alignment it lands on an even offset, so a routine with one named byte local gets its temp at [bp-6] and an unused byte at [bp-2]. Under `$A-` (every POOL unit) the byte stays at [bp-1] and the temp lands at the odd offset [bp-5], which is what ovl13:0000 shows (sub sp,6, temp offset word at [bp-5], [bp-1] never read). An explicit local assignment `P := Who^.Combat` always compiles to word moves (mov ax/mov dx), never les, so a lone pointer temp with no matching named local proves a with."
evidence = ["tools/re/tp_idioms/ovl13/PRBFAR.PAS", "src/OVL13.PAS#StartCombatantRound", "re/symbols.toml#ovl13:0000"]

[[lesson]]
id = "signed-and-of-byte-and-word"
confidence = "V"
units = ["*"]
tags = ["and", "signed", "ShortInt", "cbw", "cwde", "codegen", "branch"]
title = "`(ShortInt + 1) and Word` grows to a 32-bit and; `and Integer` stays 16-bit"
lesson = "ovl13:00C5 is `mov al,Side; cbw; inc ax; and ax, word; or al,al`: the field at +$10E is widened with cbw (a sign extend), so the source reads it signed, and the AND is 16-bit signed. In TP 6.0, `(S + 1) and W` with S: ShortInt and W: Word promotes the whole thing to LongInt (`cwde; cdq; and ax,cx; and dx,bx`), 8 bytes too long; casting the word to Integer keeps the 16-bit `and ax, word`. The `<> 0` test then picks `or ax,ax` for a 16-bit result; wrapping the expression in Byte() (the value fits a byte here) gives the original `or al,al`. Side itself stays a Byte in POOLVARS: ovl09 and res12 compare it unsigned, so the signedness lives only in this expression's casts. A one-byte branch-target shift in a later `je` (0x100 vs 0xFF) was the tell that the then-body was one byte long."
evidence = ["tools/re/tp_idioms/ovl13/PRBSIDE.PAS", "tools/re/tp_idioms/ovl13/PRBIF.PAS", "src/OVL13.PAS#StartCombatantRound", "re/symbols.toml#ovl13:0000"]

[[lesson]]
id = "shr-by-two-constants"
confidence = "V"
units = ["*"]
tags = ["shr", "shift", "codegen", "backstab"]
title = "`x shr 2` is mov cx,2; shr ax,cl, but `x shr 1 shr 1` is two shr ax,1"
lesson = "ovl13:01FB needs a thief level divided by four and the original is `cbw; shr ax,1; shr ax,1`. TP 6.0 compiles `x shr 2` with the count in CL (`mov cx,2; shr ax,cl`, 5 bytes here) but `x shr 1 shr 1` as two `shr ax,1` instructions, so when the packet shows the repeated one-bit shifts the source shifts one bit at a time (or divides by four in two steps). ovl13_fn_2574 (the backstab check) then multiplies DamageAmount by (level shr 1 shr 1) + 2. Probe tools/re/tp_idioms/ovl13/PRBSHR.PAS."
evidence = ["tools/re/tp_idioms/ovl13/PRBSHR.PAS", "src/OVL13.PAS#RollAttackDamage", "re/symbols.toml#ovl13:0191"]

[[lesson]]
id = "set-in-jcc-polarity"
confidence = "V"
units = ["*"]
tags = ["set", "in", "System_SetIn", "jcc", "case", "codegen"]
title = "`x in S` skips the body with je; `not (x in S)` with jne"
lesson = "System_SetIn (0AF8:0DC0) leaves a flag such that `if X in [6,7,8] then <body>` compiles to `call System_SetIn; je skip; <body>` (je when X is in the set), while `if not (X in [6,7,8]) then <body>` compiles to `jne skip`. ovl13:05BF is `je` before the 'is killed' body, so the source is `if Target^.Status in [6,7,8] then`, not the negated form (the set at ovl13:02CF is the 32 bytes c0 01 00.., bits 6, 7 and 8). A `case Kind of 2: ...; 3: ...; else ...; end` on a byte starts `mov al,Kind` and compares the loaded value (ovl13:0300), not a direct `cmp byte [bp+..], 2`. Probe tools/re/tp_idioms/ovl13/PRBSET.PAS."
evidence = ["tools/re/tp_idioms/ovl13/PRBSET.PAS", "src/OVL13.PAS#ShowAttackResult", "re/symbols.toml#ovl13:02F9"]

[[lesson]]
id = "inc-shortint-field-is-byte-add"
confidence = "V"
units = ["*"]
tags = ["inc", "dec", "ShortInt", "byte", "memory-add", "codegen"]
title = "Inc/Dec on a one-byte field adds in place even when the field and the addend are ShortInt"
lesson = "ovl13:0923 updates CombatantTable[Idx].X (a ShortInt field) by DirStepX[Dir] (a ShortInt). The original is the 8-bit `mov dl,[DirStepX+Dir]; mov al,Idx; xor ah,ah; ...; add byte [table+0],dl`. `Field := Field + ShortIntValue` is wrong: it widens both operands (cwde) and does a 16-bit load/add/store (ovl13's first draft, 16 bytes too long per update). `Inc(Field, ShortIntValue)` gives the byte memory add; `Dec(Field, ShortIntValue)` gives the matching `sub byte [table+0],dl`. So a one-byte field with a one-byte signed addend must be read as memory-inc/dec, not assignment (the Word counterpart is res12-inc-vs-assignment-adds-to-memory). Probe tools/re/tp_idioms/ovl13/PRBBYTE.PAS (SignedInc/ByteFieldInc give the add; all four assignment forms widen)."
evidence = ["tools/re/tp_idioms/ovl13/PRBBYTE.PAS", "src/OVL13.PAS#PartingShots", "re/symbols.toml#ovl13:08B2"]

[[lesson]]
id = "odd-is-shr-carry-not-test"
confidence = "V"
units = ["*"]
tags = ["Odd", "boolean", "shr", "carry", "codegen"]
title = "`Odd(X)` compiles to `mov al,X; shr al,1; jae`, not `test al,1`"
lesson = "ovl13:0E52 tests the low bit of the combat round counter ds6DE3 and conditionally increments a local. The original is `mov al,[ds6DE3]; shr al,1; jae skip; inc byte [bp-2]`, i.e. it reads bit 0 through the carry of a one-bit shift. TP 6.0 gives exactly that for `if Odd(ds6DE3) then Inc(Count);` (probe F1). The alternative `if (G and 1) <> 0 then Inc(Count)` compiles to `mov al,G; and al,1; or al,al; je` and `if Odd(G) then ... Ord(Odd(G))` builds a 16-bit value (`mov al,0; jae/inc ax`). So a `shr al,1` followed by a conditional increment is the source `Odd(X)`, and the trailing `mov al,Count; xor ah,ah; shr ax,1` is a byte `shr 1`."
evidence = ["tools/re/tp_idioms/ovl13/PRBHALF.PAS", "src/OVL13.PAS#AttacksThisRound", "re/symbols.toml#ovl13:0E52"]

[[lesson]]
id = "assign-then-compare-stores-then-reloads"
confidence = "V"
units = ["*"]
tags = ["array", "local", "store", "reload", "pointer", "codegen"]
title = "Assigning an array element to a local before comparing it stores and reloads; comparing the element directly does not"
lesson = "ovl13:0E82's sweep moves the first adjacent enemy out of ds6DE4 when it is not the target. The original loads `CombatantRecord[ds6DE4[1]]` into AX:DX, stores it to the Enemy local ([bp-9]/[bp-7]) and reloads it for the `Enemy <> Target` test (12 bytes: mov [bp-9],ax; mov [bp-7],dx; mov ax,[bp-9]; mov dx,[bp-7]). Writing `if CombatantRecord[ds6DE4[1]] <> Target then` instead of `Enemy := CombatantRecord[ds6DE4[1]]; if Enemy <> Target then` omits the store and reload, 12 bytes short. So a repeated array/pointer expression reads directly but a named local is round-tripped through its frame slot."
evidence = ["src/OVL13.PAS#SweepEnemies", "re/symbols.toml#ovl13:0E82"]

[[lesson]]
id = "untyped-var-parameter-bridges-callers"
confidence = "V"
units = ["*"]
tags = ["var", "parameter", "untyped", "compilation", "codegen"]
title = "An untyped `var B` parameter lets callers pass differently typed variables"
lesson = "ovl13:1351 (ovl13_e10) writes 4 bytes through its second parameter (`xor ax,ax; mov es:[di],ax; mov es:[di+2],ax`), so it is a `var` far pointer. Its two callers pass different things: TurnUndead (ovl13:116A) passes a PCharacter local and TryTurnUndead (ovl09:0203) passes a 1-byte `Done` plus a 3-byte `Unused` array. A typed `var B: PCharacter` would not accept ovl09's Byte and a `var B: Byte` would not accept ovl13's PCharacter, but the untyped form `function ovl13_e10(Who: Pointer; var B): Boolean` compiles both and emits the same far address push, so the declaration bridges them (the callee alone knows the size). Probe tools/re/tp_idioms/ovl13/PRBTURN.PAS is for the table index, not this. The untyped parameter does not change the caller's code (the address pushed is the same)."
evidence = ["src/OVL13.PAS#TurnUndead", "src/OVL09.PAS#TryTurnUndead", "re/symbols.toml#ovl13:1351"]
