tags = ["map", "runtime", "res00", "System", "rtl_ident", "0AFC", "Abs", "42ED"]
title = "System 0AF8:0AFC (LongInt Abs) was missing from the registry because rtl_ident.py scans only the base EXE"
lesson = "ovl16:42ED calls 0AF8:0AFC (9a fc 0a f8 0a at ovl16:43D2) for `Amount := Abs(Amount)` on a LongInt, but re/symbols.toml had no entry there: res00_fn_0AF0 carried size 27 (the gap to 0B0B) and swallowed 0AFC, and tools/re/rtl_ident.py builds the runtime far-call graph from poolrad/start-unpack.exe only, so a call from an overlay (GAME.OVR) is never seen. A Pascal call always targets a routine entry, so 0AFC is its own routine: the entry was added with size 15 and res00_fn_0AF0's size corrected to 12. The fix is safe for every existing unit (make match: 43 units, 474 routines, all match). A complete fix would have rtl_ident.py scan the overlay binaries too."
