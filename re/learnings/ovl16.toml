# Lessons from ovl16, backed by TP 6.0 probes or matched routines.

[[lesson]]
id = "overlay-far-call-target-artifact"
confidence = "V"
units = ["*"]
tags = ["map", "boundaries", "stubs", "far-call", "overlay"]
title = "An overlay far_call map entry is an inter-overlay stub call read as a flat linear address"
lesson = "tools/re/enumerate_routines.py find_in_region scans every 0x9A byte of an overlay and keys a routine start on linear = seg * 16 + off. A call to another overlay goes through the target unit's stub segment (build/re/overlays.json), so a stub call such as lcall 0x0085:0x0025 is misread as a start at 0x0875 of the calling unit whenever stub_segment * 16 + stub_offset lands inside the unit. In ovl16 the stub segment 0x0085 belongs to ovl19, so the flat readings 0x0875, 0x087A, 0x087F, 0x0884, 0x0889, 0x08A2 (and 0x08A7, 0x08AC) all fall inside the single large routine ovl16:056C and are not routines at all. A suspect entry has evidence far_call, no prologue (55 89 e5 or 55 8b ec) at its address, no E8 near call targeting it, and lies between the enclosing routine's single prologue and its single retf. Name the real callee by listing build/re/overlays.json for the overlay whose stub_segment is the lcall segment and whose stub_offset is linear - seg * 16."
evidence = ["tools/re/enumerate_routines.py#find_in_region", "re/symbols.toml#ovl16:0875", "re/symbols.toml#ovl16:08A2"]
