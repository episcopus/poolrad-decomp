[[lesson]]
id = "ovl16-with-copies-a-far-pointer-parameter"
confidence = "V"
units = ["ovl16", "*"]
tags = ["with", "far-pointer", "frame", "les", "codegen", "3F31", "3FB3"]
title = "`with Who^ do` copies a far-pointer parameter to a hidden local with les di; Ch := Who uses mov ax/mov dx"
lesson = "ovl16:3F31 and 3FB3 take Who: PCharacter and begin with `les di,[bp+6]; mov [bp-X],di; mov [bp-X+2],es` (the hidden `with Who^ do` context pointer), then read it back with `les di,[bp-X]`. Writing the copy by hand (`Ch := Who`) compiles instead to `mov ax,[bp+6]; mov dx,[bp+8]; mov [bp-X],ax; mov [bp-X+2],dx` and cannot match (tools/re/tp_idioms/ovl16/CONHP.PAS). The hidden temp is allocated right after the declared locals, so its offset pins the number of byte locals: 3F31 needs a third spare byte at [bp-4] (result bp-1, Sum bp-2, counter bp-3, spare bp-4, temp bp-5..bp-8)."
evidence = ["src/OVL16.PAS#ConstitutionHitPointAdjustment", "src/OVL16.PAS#MinHitPoints", "re/symbols.toml#ovl16:3F31", "re/symbols.toml#ovl16:3FB3", "tools/re/tp_idioms/ovl16/CONHP.PAS"]

[[lesson]]
id = "ovl16-for-counter-type-and-index-extension"
confidence = "V"
units = ["ovl16", "*"]
tags = ["for", "loop", "shortint", "byte", "cbw", "index", "codegen", "3F31", "3FB3"]
title = "A ShortInt for-loop counter of small bounds uses byte ops but sign-extends its array index; a Byte counter zero-extends"
lesson = "In 3F31 and 3FB3 the class loop is `for I := 0 to 7` with the counter stored, incremented and compared as a byte (`mov byte [bp-3],0; inc byte [bp-3]; cmp byte [bp-3],7`) but the ClassLevels[I] index is sign-extended: `mov al,[bp-3]; cbw; les di,[bp-8]; add di,ax`. A Byte counter gives `xor ah,ah` instead and the bytes differ; declaring I: ShortInt (even though the loop only stores one byte) reproduces the original. Probe tools/re/tp_idioms/ovl16/CONHP.PAS."
evidence = ["src/OVL16.PAS#ConstitutionHitPointAdjustment", "src/OVL16.PAS#MinHitPoints", "re/symbols.toml#ovl16:3F31", "re/symbols.toml#ovl16:3FB3", "tools/re/tp_idioms/ovl16/CONHP.PAS"]

[[lesson]]
id = "ovl16-case-loads-the-selector-once"
confidence = "V"
units = ["ovl16", "*"]
tags = ["case", "if", "selector", "codegen", "3FB3"]
title = "A two-label case statement loads the selector into AL once; an if/else chain compares memory twice"
lesson = "ovl16:3FB3 adds a hit-die level for class 4 and class 7. `if I = 4 then Inc(Total) else if I = 7 then Inc(Total)` compiles to two direct compares (`cmp byte [bp-5],4` then `cmp byte [bp-5],7`, 8 bytes). `case I of 4: Inc(Total); 7: Inc(Total); end;` loads the selector once (`mov al,[bp-5]; cmp al,4; jne ..; inc; jmp ..; cmp al,7; jne ..; inc`, 7 bytes) and is what the original does; the one-byte difference moves every later label and makes the whole routine differ. Probe tools/re/tp_idioms/ovl16/HPCASE.PAS."
