[[lesson]]
id = "ovl16-succ-shortint-index-incs-before-sign-extend"
confidence = "V"
units = ["ovl16", "*"]
tags = ["succ", "shortint", "index", "cbw", "array", "codegen", "29AE"]
title = "Succ(ShortInt) used as a subscript increments the byte before sign-extending; Level + 1 sign-extends first"
lesson = "TrainCharacter (ovl16:29AE) indexes ds409B[I, next level] with `mov al,[bp-0x18]; inc al; cwde; shl ax,1; shl ax,1`, and the level after that with two `inc al` before the cwde. `Level + 1` on a ShortInt is `cwde; inc ax` (and `Level + 2` is `cwde; inc ax; inc ax`), which is what blocked the earlier drafts. `Succ(Level)` as the subscript, not assigned back to a ShortInt, is the inc-then-sign-extend form; `Succ(Succ(Level))` is two inc al. Assigning Succ back (`Level := Succ(Level)`) is a different sequence (`cwde; inc ax; mov`), so the subscript must be the Succ expression itself. The > 0 test on the next level's threshold compares the array element in memory (`cmp word [di+high],0; jg; jge; jmp; cmp word [di+low],0; ja`), which a direct `ds409B[I, Succ(Level)] > 0` gives; loading it into a LongInt local first does not. Probe tools/re/tp_idioms/ovl16/LVLIDX.PAS."
evidence = ["src/OVL16.PAS#TrainCharacter", "re/symbols.toml#ovl16:29AE", "tools/re/tp_idioms/ovl16/LVLIDX.PAS"]
