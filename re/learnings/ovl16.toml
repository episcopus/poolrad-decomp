[[lesson]]
id = "ovl16-enum-succ-pred-coin-kind"
confidence = "V"
units = ["ovl16", "*"]
tags = ["enum", "succ", "pred", "byte", "shortint", "codegen", "42ED"]
title = "Succ/Pred on an enumerated type compile to `mov al,x; inc al/dec al; mov x,al`; on Byte or ShortInt they do not"
lesson = "ovl16:42ED walks its coin kind with `mov al,[bp-3]; inc al; mov [bp-3],al` (and `dec al` back), which is the codegen of `E := Succ(E)` / `E := Pred(E)` on an enumerated type (INCPRB.PAS, A7/A8). A ShortInt gives `mov al; cwde; inc ax; mov x,al` for `X := X + 1` and `cwde; inc ax` for `Succ`, a Byte gives `inc byte [mem]` for Inc and `xor ah,ah; inc ax` for `X := X + 1`, and none of those match. The same variable indexes CoinCopperValues and Money with cwde (`mov al,[bp-3]; cwde`), which a ShortInt index also gives, so an enum kind with Ord(Kind) at the subscripts (array[0..6] cannot be indexed by an enum directly) is the declaration that reproduces the original. PAYPRB2.PAS is the whole-routine probe; it also settles that `Abs(LongInt)` is a call to System+0AFC, `LongInt * LongInt` to System+0A5B and `LongInt div LongInt` to System+0A76, and that Dec(Amount, X) on a LongInt parameter is sub/sbb on the memory operand."
evidence = ["src/OVL16.PAS#PayGold", "re/symbols.toml#ovl16:42ED", "tools/re/tp_idioms/ovl16/INCPRB.PAS", "tools/re/tp_idioms/ovl16/PAYPRB2.PAS"]

[[lesson]]
