# Lessons from ovl16, backed by TP 6.0 probes or matched routines.

[[lesson]]
id = "overlay-far-call-target-artifact"
confidence = "V"
units = ["*"]
tags = ["map", "boundaries", "stubs", "far-call", "overlay"]
title = "An overlay far_call map entry is an inter-overlay stub call read as a flat linear address"
lesson = "tools/re/enumerate_routines.py find_in_region scans every 0x9A byte of an overlay and keys a routine start on linear = seg * 16 + off. A call to another overlay goes through the target unit's stub segment (build/re/overlays.json), so a stub call such as lcall 0x0085:0x0025 is misread as a start at 0x0875 of the calling unit whenever stub_segment * 16 + stub_offset lands inside the unit. In ovl16 the stub segment 0x0085 belongs to ovl19, so the flat readings 0x0875, 0x087A, 0x087F, 0x0884, 0x0889, 0x08A2 (and 0x08A7, 0x08AC) all fall inside the single large routine ovl16:056C and are not routines at all. Calls through the ovl23 stub segment 0x00AC produce more of the same inside 056C: the flat readings 0x0AE5, 0x0AEA, 0x0AEF and 0x0AF4 (stub offsets 0x25, 0x2A, 0x2F, 0x34 = RecalcClassStats, AddWisdomBonusSpells, ComputeSavingThrows, ComputeThiefSkills). The whole region 056C..1ED1 has exactly one prologue (55 89 e5 at 056C) and one retf (at 1ED1), so 056C is a single routine and every map entry inside it is an artefact. A suspect entry has evidence far_call, no prologue (55 89 e5 or 55 8b ec) at its address, no E8 near call targeting it, and lies between the enclosing routine's single prologue and its single retf. Name the real callee by listing build/re/overlays.json for the overlay whose stub_segment is the lcall segment and whose stub_offset is linear - seg * 16."
evidence = ["tools/re/enumerate_routines.py#find_in_region", "re/symbols.toml#ovl16:0875", "re/symbols.toml#ovl16:08A2", "re/symbols.toml#ovl16:08A7", "re/symbols.toml#ovl16:0AF4"]

[[lesson]]
id = "near-call-artifact-from-modrm-disp8"
confidence = "V"
units = ["*"]
tags = ["map", "boundaries", "stubs", "near-call", "modrm", "overlay"]
title = "A near_call map entry can be a ModRM displacement byte 0xE8 read as a call opcode"
lesson = "enumerate_routines.py also keys a start on an 0xE8 byte read as a near call (target = i + 3 + rel16). But 0xE8 is a common ModRM displacement byte: any 16-bit-load instruction form like c4 7e e8 (les di,[bp-0x18]) or 8b 46 e8 (mov ax,[bp-0x18]) carries a literal 0xE8 that the scanner reads as an opcode, and the next two bytes (real instruction bytes) form a bogus rel16. In ovl16 the near_call entry 0x19D3 comes only from the 0xE8 disp8 of les di,[bp-0x18] at ovl16:21CB; the entry has no prologue (55 89 e5 / 55 8b ec) and no genuine call reaches it. Confirm a near_call entry is real by decoding the bytes around the reported source offset (here 0x21CD) rather than trusting the evidence tag. The same c4 7e e8 (les di,[bp-0x18]) pattern at ovl16:21F3, 2222, 2249, 2279, 229F and 22C6 produces the ovl16 near_call entries 0x19FB, 0x1A2A, 0x1A51, 0x1A81, 0x1AA7 and 0x1ACE. The ovl16 batch 0B48, 0B52, 1307, 1513, 1758 (all far_call) come from stub segments 0x00B0 (ovl24) and 0x00BA (res12): flat = 0x0B48 -> 0x00B0:0x0048 RollDice, 0x0B52 -> 0x00B0:0x0052 AddAffect, 0x1307 -> 0x00BA:0x0767 DrawPartyRoster, 0x1513 -> 0x00BA:0x0973 DrawHitPoints, 0x1758 -> 0x00BA:0x0BB8 RecalcCombatValues. All six are mid-instruction inside 056C and are removed when 056C matches."
evidence = ["re/symbols.toml#ovl16:19D3", "re/symbols.toml#ovl16:0B48", "re/symbols.toml#ovl16:0B52", "re/symbols.toml#ovl16:1307", "re/symbols.toml#ovl16:1513", "re/symbols.toml#ovl16:1758", "re/symbols.toml#ovl16:19FB", "re/symbols.toml#ovl16:1A2A", "re/symbols.toml#ovl16:1A51", "re/symbols.toml#ovl16:1A81", "re/symbols.toml#ovl16:1AA7", "re/symbols.toml#ovl16:1ACE"]
