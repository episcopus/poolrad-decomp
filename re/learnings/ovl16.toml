# Lessons from ovl16, backed by TP 6.0 probes or matched routines.

[[lesson]]
id = "overlay-far-call-target-artifact"
confidence = "V"
units = ["*"]
tags = ["map", "boundaries", "stubs", "far-call", "overlay"]
title = "An overlay far_call map entry is an inter-overlay stub call read as a flat linear address"
lesson = "tools/re/enumerate_routines.py find_in_region scans every 0x9A byte of an overlay and keys a routine start on linear = seg * 16 + off. A call to another overlay goes through the target unit's stub segment (build/re/overlays.json), so a stub call such as lcall 0x0085:0x0025 is misread as a start at 0x0875 of the calling unit whenever stub_segment * 16 + stub_offset lands inside the unit. In ovl16 the stub segment 0x0085 belongs to ovl19, so the flat readings 0x0875, 0x087A, 0x087F, 0x0884, 0x0889, 0x08A2 (and 0x08A7, 0x08AC) all fall inside the single large routine ovl16:056C and are not routines at all. Calls through the ovl23 stub segment 0x00AC produce more of the same inside 056C: the flat readings 0x0AE5, 0x0AEA, 0x0AEF and 0x0AF4 (stub offsets 0x25, 0x2A, 0x2F, 0x34 = RecalcClassStats, AddWisdomBonusSpells, ComputeSavingThrows, ComputeThiefSkills). The whole region 056C..1ED1 has exactly one prologue (55 89 e5 at 056C) and one retf (at 1ED1), so 056C is a single routine and every map entry inside it is an artefact. A suspect entry has evidence far_call, no prologue (55 89 e5 or 55 8b ec) at its address, no E8 near call targeting it, and lies between the enclosing routine's single prologue and its single retf. Name the real callee by listing build/re/overlays.json for the overlay whose stub_segment is the lcall segment and whose stub_offset is linear - seg * 16."
evidence = ["tools/re/enumerate_routines.py#find_in_region", "re/symbols.toml#ovl16:0875", "re/symbols.toml#ovl16:08A2", "re/symbols.toml#ovl16:08A7", "re/symbols.toml#ovl16:0AF4"]

[[lesson]]
id = "near-call-artifact-from-modrm-disp8"
confidence = "V"
units = ["*"]
tags = ["map", "boundaries", "stubs", "near-call", "modrm", "overlay"]
title = "A near_call map entry can be a ModRM displacement byte 0xE8 read as a call opcode"
lesson = "enumerate_routines.py also keys a start on an 0xE8 byte read as a near call (target = i + 3 + rel16). But 0xE8 is a common ModRM displacement byte: any 16-bit-load instruction form like c4 7e e8 (les di,[bp-0x18]) or 8b 46 e8 (mov ax,[bp-0x18]) carries a literal 0xE8 that the scanner reads as an opcode, and the next two bytes (real instruction bytes) form a bogus rel16. In ovl16 the near_call entry 0x19D3 comes only from the 0xE8 disp8 of les di,[bp-0x18] at ovl16:21CB; the entry has no prologue (55 89 e5 / 55 8b ec) and no genuine call reaches it. Confirm a near_call entry is real by decoding the bytes around the reported source offset (here 0x21CD) rather than trusting the evidence tag. The same c4 7e e8 (les di,[bp-0x18]) pattern at ovl16:21F3, 2222, 2249, 2279, 229F and 22C6 produces the ovl16 near_call entries 0x19FB, 0x1A2A, 0x1A51, 0x1A81, 0x1AA7 and 0x1ACE."
evidence = ["re/symbols.toml#ovl16:19D3", "re/symbols.toml#ovl16:19FB", "re/symbols.toml#ovl16:1A2A", "re/symbols.toml#ovl16:1A51", "re/symbols.toml#ovl16:1A81", "re/symbols.toml#ovl16:1AA7", "re/symbols.toml#ovl16:1ACE"]

[[lesson]]
id = "near-call-artifact-ovl16-entries"
confidence = "V"
units = ["ovl16"]
tags = ["map", "boundaries", "stubs", "near-call", "far-call", "overlay", "056C"]
title = "The ovl16 056C region map entries are fixup and ModRM artefact readings inside one routine"
lesson = "The ovl16 far_call entries 0B48, 0B52, 1307, 1513, 1758 come from stub segments 0x00B0 (ovl24) and 0x00BA (res12): flat 0x0B48 -> 0x00B0:0x0048 RollDice, 0x0B52 -> 0x00B0:0x0052 AddAffect, 0x1307 -> 0x00BA:0x0767 DrawPartyRoster, 0x1513 -> 0x00BA:0x0973 DrawHitPoints, 0x1758 -> 0x00BA:0x0BB8 RecalcCombatValues. All of these, and every near_call entry between 056C and 1F37, lie inside the single routine ovl16:056C or its literal pool. Decide a suspect entry from our bytes, not the evidence tag: scan build/re/overlays/ovl16.bin for prologues (55 89 e5 / 55 8b ec) and retf (0xCB). Between 0x0161 and 0x1F37 there are exactly two prologues (0x056C and 0x1F37) and one retf (0x1ED1), so 056C runs 056C..1ED1 and 1ED2..1F36 is a string-literal pool. Entries there are removed when 056C matches (make match UNIT=ovl16 WRITE=1)."
evidence = ["tools/re/enumerate_routines.py#find_in_region", "re/symbols.toml#ovl16:0B48", "re/symbols.toml#ovl16:0B52", "re/symbols.toml#ovl16:1307", "re/symbols.toml#ovl16:1513", "re/symbols.toml#ovl16:1758", "re/symbols.toml#ovl16:056C"]

[[lesson]]
id = "near-call-artifact-ovl16-upper-056C"
confidence = "V"
units = ["ovl16"]
tags = ["map", "boundaries", "stubs", "near-call", "modrm", "overlay", "056C"]
title = "The batch 7 to 10 ovl16 near_call entries are all inside 056C or its literal pool"
lesson = "Every near_call artefact in the upper half of ovl16:056C is an 0xE8 disp8 byte (c4 7e e8 les di,[bp-0x18], or d1 e8 shr ax,1) whose following instruction bytes form the bogus rel16; the target is mid-056C. Batch 7: c4 7e e8 at 0x22E9, 0x2312, 0x2339, 0x235C, 0x23A3, 0x23CA (E8 at 0x22EB, 0x2314, 0x233B, 0x235E, 0x23A5, 0x23CC, rel16 03 f8) keys 1AF1, 1B1A, 1B41, 1B64, 1BAB, 1BD2. Batch 8: the resident stub lcall 0x00BA:0x1037 (9a 37 10 ba 00) keys far_call 1BD7, and c4 7e e8 at 0x23ED, 0x2416, 0x243D, 0x2460, 0x24CC keys 1BF5, 1C1E, 1C45, 1C68, 1CD4. Batch 9: c4 7e e8 at 0x24F3, 0x2516, 0x257C, 0x25B2, 0x25C3, 0x262C keys 1CFB, 1D1E, 1D84, 1DBA, 1DCB, 1E34. Batch 10: c4 7e e8 at 0x2652, 0x2675, 0x269B, 0x26BE, 0x2705 keys 1E5A, 1E7D, 1EA3, 1EC6, 1F0D and d1 e8 at 0x35E4 keys 1EB9. Of these, 1E5A, 1E7D and 1EA3 are instruction boundaries inside 056C, 1EB9 and 1EC6 are mid-instruction, and 1F0D is in the literal pool after the retf at 1ED1. A capstone CS_MODE_16 linear sweep of code[0x056C:0x1ED1] decodes to the retf at 1ED1 with no desync, so it tells boundary from mid-instruction reliably."
evidence = ["re/symbols.toml#ovl16:1AF1", "re/symbols.toml#ovl16:1BD2", "re/symbols.toml#ovl16:1BD7", "re/symbols.toml#ovl16:1CD4", "re/symbols.toml#ovl16:1E34", "re/symbols.toml#ovl16:1E5A", "re/symbols.toml#ovl16:1E7D", "re/symbols.toml#ovl16:1EA3", "re/symbols.toml#ovl16:1EB9", "re/symbols.toml#ovl16:1EC6", "re/symbols.toml#ovl16:1F0D"]

[[lesson]]
id = "dropcharacter-with-temp-vs-pointer-local"
confidence = "V"
units = ["ovl16"]
tags = ["with", "pointer", "temp", "frame", "les", "codegen", "1F37"]
title = "DropCharacter reads the selected character through a with temp, not a pointer local"
lesson = "ovl16:1F37 (DropCharacter) is `if SelectedCharacter = nil then Exit; with SelectedCharacter^ do ...`. The `with` loads the pointer once with `les di,[0x5d92]; mov [bp-5],di; mov [bp-3],es` and reads Name and Flag10D through `les di,[bp-5]`. Writing it as `Who: PCharacter; Who := SelectedCharacter;` compiles to word moves (`mov ax,[Sel]; mov dx,[Sel+2]; mov [bp-5],ax; mov [bp-3],dx`), 3 bytes longer, so the exit jump becomes e9e800 instead of e9e500 and every later offset shifts; the routine cannot match that way. The `with` temp sits below the named locals, so the frame still shows the original's spare one-byte local at [bp-1] above it (declared local order, first nearest bp). Probes tools/re/tp_idioms/ovl16/DROP3.PAS (pointer local) and DROP4.PAS (with), both using DROPU.PAS so the external calls are lcall. See re/learnings/ovl17.toml with-temp-below-named-locals."
evidence = ["src/OVL16.PAS#DropCharacter", "re/symbols.toml#ovl16:1F37", "tools/re/tp_idioms/ovl16/DROP3.PAS", "tools/re/tp_idioms/ovl16/DROP4.PAS"]

[[lesson]]
id = "near-call-artifact-ovl16-1F37-body-and-pool"
confidence = "V"
units = ["ovl16"]
tags = ["map", "boundaries", "near-call", "pool", "1F37"]
title = "The ovl16 1F30..200B map entries lie inside DropCharacter (1F37) and its literal pool"
lesson = "Between ovl16:1F37 (DropCharacter, one prologue 55 89 e5) and its retf at 2032 the only bytes are its body; the 101-byte string pool just before it (1ED2..1F36, 'Drop ', ' forever? ', 'Are you sure? ', 'You dump ', ' out back.', ' bids you farewell.', ' breathes a sigh of relief.') belongs to DropCharacter, not 056C. So near_call entries 1F59 (an instruction boundary, push di), 1F7C (mid-instruction) and 1FE8 (last byte of lea di,[bp-0x214]) are inside its body, 200B is the false-positive target of the E8 disp8 at 0x2805 landing on DropCharacter's own `call 0x3291` (ovl16_e2), and 1F30 sits inside ' breathes a sigh of relief.' in its pool. make match UNIT=ovl16 WRITE=1 removed all of these (and the earlier 1F0D and 2013, also in this pool/body) when DropCharacter matched."
evidence = ["re/symbols.toml#ovl16:1F37", "re/symbols.toml#ovl16:1F30", "re/symbols.toml#ovl16:1F59", "re/symbols.toml#ovl16:200B", "src/OVL16.PAS#DropCharacter"]

[[lesson]]
id = "ovl16-2d-array-index-builds-di"
confidence = "V"
units = ["ovl16", "*"]
tags = ["array", "index", "codegen", "di", "ax", "2d", "209F"]
title = "A two-dimensional byte-array index builds the index in DI; a flat index shifts AX"
lesson = "ModifyCharacter (ovl16:209F) indexes the per-race limits as ds3DA3[Race, B9E]. Written as a two dimensional array array[0..$F, 0..$F] of Byte, TP6 emits `mov al,<Race>; cwde; mov di,ax; mov cl,4; shl di,cl; add di,dx` (the index in DI), which is what the original does (8b f8 b1 04 d3 e7, 52 times in ovl16). Written as a flat array ds3DA3[Race*16 + B9E] it emits `shl ax,cl; ...; mov di,ax` instead and cannot match. A constant second subscript (ds3DA3[Race, 6]) folds into the base displacement ([di+base+6] = DS:3DA9). Probe tools/re/tp_idioms/ovl16/RIDXPRB.PAS."
evidence = ["src/OVL16.PAS#ModifyCharacter", "re/symbols.toml#ovl16:209F", "tools/re/tp_idioms/ovl16/RIDXPRB.PAS"]

[[lesson]]
id = "ovl16-shifted-bound-absolute-alias"
confidence = "V"
units = ["ovl16", "*"]
tags = ["absolute", "array", "index", "codegen", "209F"]
title = "A shifted second-dimension lower bound in an absolute alias folds a constant into the base"
lesson = "The per-race Strength maximum and percentile maximum are the same 16-byte rows read two and four columns on (DS:3DA5, DS:3DA7), so the original emits `add di,dx; mov dl,[di+0x3da5]` with the same index Race*16+B9E as the minimum. `ds3DA3[Race, B9E + 2]` does not match (TP emits inc ax; inc ax). Declaring RaceStrengthMax: array[0..$F, -2..$D] of Byte absolute ds3DA3 and indexing RaceStrengthMax[Race, B9E] folds the +2 into the base exactly. The alias must NOT be named dsXXXX (make match rejects an absolute alias whose ds-name offset disagrees with its base). Probe tools/re/tp_idioms/ovl16/ABSPRB.PAS."
evidence = ["src/OVL16.PAS#ModifyCharacter", "src/POOLVARS.PAS", "tools/re/tp_idioms/ovl16/ABSPRB.PAS"]

[[lesson]]
id = "ovl16-nested-showstat-static-link"
confidence = "V"
units = ["ovl16", "*"]
tags = ["nested", "static-link", "with", "frame", "2033", "209F"]
title = "ovl16:2033 is a nested routine of ModifyCharacter that redraws the cursor's value"
lesson = "The map lists ovl16:2033 as a top-level routine, but its only callers are in ModifyCharacter (ovl16:209F) and it reads the parent's local StatIndex through the static link: the calls are `push <boolean>; push bp; push cs; call`, and the body is `if ss:[di-0xd] < 6 then ShowAbilityScore else DrawHitPoints` with di from [bp+6]. It is emitted in 209F's pre-entry region (2033 before the 108-byte literal pool 206E..209D and the entry 209F), so it must be declared nested (procedure ShowStat inside ModifyCharacter) and its top-level {stub} removed; make match UNIT=ovl16 WRITE=1 reports it NESTED and marks 2033 L2. Probe tools/re/tp_idioms/ovl16/NEST1.PAS (call shape push ax; push bp; push cs; call)."
evidence = ["src/OVL16.PAS#ModifyCharacter", "re/symbols.toml#ovl16:2033", "tools/re/tp_idioms/ovl16/NEST1.PAS"]

[[lesson]]
id = "ovl16-modifycharacter-frame-and-loop"
confidence = "V"
units = ["ovl16"]
tags = ["frame", "with", "repeat", "case", "209F"]
title = "ModifyCharacter's frame, with temp and loop shape"
lesson = "ModifyCharacter (ovl16:209F) has a 276-byte frame (sub sp, 0x114): 20 bytes of named locals (SavedScores [bp-6..bp-1], SavedStrengthPercent, SavedHpMax, one spare byte at [bp-9], Stat, Key, ExtKey, StatIndex, and seven spare bytes the original reserves before the with temp), a 4-byte `with SelectedCharacter^ do` temp at [bp-0x15..bp-0x18], and the compiler string temporaries. The loop is `repeat ... until (ExtKey = 0) and (Key = KeyKeep)` followed by HirelingShare := 1 (the je+jmp form, not jne); the key dispatch and the ability adjust are `case` statements, and a large-bodied `case Stat of` alternates its je/jne by body size (the ==127 rel8 range). The exit path restores the saved scores."
evidence = ["src/OVL16.PAS#ModifyCharacter", "re/symbols.toml#ovl16:209F"]

[[lesson]]
id = "ovl16-with-field-shadows-local"
confidence = "V"
units = ["ovl16", "*"]
tags = ["with", "scope", "local", "field", "codegen", "29AE"]
title = "A local named like a TCharacter field resolves to the field inside `with`"
lesson = "ovl16:29AE declares a local ClassBits, but inside `with SelectedCharacter^ do` the name resolves to TCharacter.ClassBits (+$B0), so `ClassBits := ...` compiled to `les di,[bp-0x21]; mov es:[di+0xb0],...` while the original writes the local [bp-0xb]. Renaming the local to ClassBitMask made the target [bp-0xb]. Check every local name against the with record's fields before trusting the offsets."
