[[lesson]]
id = "array-index-constant-gives-base"
confidence = "V"
units = ["ovl12"]
tags = ["array", "index", "base", "dseg", "codegen", "string"]
title = "An array[1..8] of string[15] index compiles to base - 16 plus 16*I"
lesson = "For ds0382: array[1..8] of string[15] at DS:0382, BoostAttackVsEightListed (ovl12:0947) adds the constant 372h and shl 4 of I, which is 382h - 16 + 16*I. ovl12:11F9 uses 3F2h + 16*I, so its table starts at DS:0402, the byte after ds0382 (declared as ds0402 in POOLVARS.PAS, its text not read yet). Reading the constant of the index gives the table's base without the map."
evidence = ["src/POOLVARS.PAS#ds0402", "src/OVL12.PAS#LowerAttackVsEightListed", "re/symbols.toml#ovl12:0947"]

[[lesson]]
id = "function-result-tested-for-effect"
confidence = "V"
units = ["ovl12"]
tags = ["function", "statement", "if", "empty", "Byte", "codegen", "call"]
title = "A Byte function called only for its effect is an if with an empty branch"
lesson = "Turbo Pascal 6.0 rejects a bare function call as a statement (Error 122, probe tools/re/tp_idioms/ovl12/FNSTMT.PAS). The original calls res12_fn_2637(Who) and drops the result: it compiles to a push of Who, the call, `or al, al` and `je` to the next instruction (ovl12:133F, 22 bytes). The source that matched is `if res12_fn_2637(Who) <> 0 then ;` with an empty statement. The Exit form was not probed."
evidence = ["src/OVL12.PAS#ovl12_e43", "re/symbols.toml#ovl12:133F", "tools/re/tp_idioms/ovl12/FNSTMT.PAS"]

[[lesson]]
id = "then-else-swapped-shows-ja-for-jbe"
confidence = "V"
units = ["ovl12"]
tags = ["if", "else", "compare", "branch", "codegen", "jbe", "ja"]
title = "A diff of ja where the original has jbe means the branches of the if are swapped"
lesson = "ProgressRot (ovl12:1399) first wrote `if Who^.Charisma <= 2 then Who^.Charisma := 0 else Dec(Who^.Charisma, 2)`: the match showed `ja 0x13dd` where the original has `jbe 0x13dd`, the jump to the zero assignment. The original tests `> 2` first and its then branch is the subtraction, so the matched form is `if Who^.Charisma > RotCharismaLoss then Dec(...) else Who^.Charisma := 0`. Check the jump sense in the packet before reversing the test."
evidence = ["src/OVL12.PAS#ProgressRot", "re/symbols.toml#ovl12:1399"]

[[lesson]]
id = "map-entry-in-literal-pool"
confidence = "V"
units = ["ovl12"]
tags = ["map", "boundary", "pool", "entry", "write", "tooling"]
title = "A map entry in a routine's literal pool or inside its code is not a routine (ovl12:1543, ovl12:1583)"
lesson = "The map listed ovl12:1543 (2 bytes, auto:near_call) and ovl12:1583 (104 bytes, auto:far_call). The bytes at 1543 are the tail `ed` of the string 'is killed' in the literal pool of ovl12:1545, followed by the push bp of 1545; the bytes at 1583 are the displacement byte of `lea di, [bp-0Ch]` (8D 7E F4 at 1582). When PoisonAttackTarget (ovl12:1545, 153 bytes, 22 bytes of pool) matched, `make match UNIT=ovl12 WRITE=1` removed both entries and corrected the size of ovl12:14EB from 88 to 90 (its 68 bytes plus the next routine's 22-byte pool). The source lost their stub lines and interface declarations afterwards; a declaration left behind fails with 'Undefined forward'. Compare the first byte of an invented entry with the bytes before it before any probe."
evidence = ["src/OVL12.PAS#PoisonAttackTarget", "re/symbols.toml#ovl12:1545", "re/symbols.toml#ovl12:14EB"]

[[lesson]]
id = "for-global-bound-copied-to-frame"
confidence = "V"
units = ["ovl12"]
tags = ["for", "loop", "bound", "frame", "Byte", "global", "codegen"]
title = "for I := 1 to G with a Byte global G: the bound is copied into a frame slot below the counter"
lesson = "ReduceFireDamageByRoll (ovl12:1490) has `sub sp, 2` and matches `for I := 1 to ds681C do` with `var I: Byte`: the bound is copied first (`mov al, [681Ch]; mov [bp-2], al`), the counter starts at `mov [bp-1], 1` after a `cmp al, [bp-2]; ja` skip over the body, and the loop ends with `cmp al, [bp-2]; jne` after `inc byte ptr [bp-1]`. The two frame bytes are exactly the counter and the bound copy, so no other local is declared. The body reads the global again, not the copy."
evidence = ["src/OVL12.PAS#ReduceFireDamageByRoll", "re/symbols.toml#ovl12:1490"]

[[lesson]]
id = "readability-r3-address-form"
confidence = "V"
units = ["ovl12"]
tags = ["readability", "R3", "comment", "address", "tooling"]
title = "R3 accepts a routine comment only when it cites an address as ovl12:XXXX; a bare '1490.' fails"
lesson = "After `make rename` gave ovl12_e50 its name, `make readability UNIT=ovl12` failed R3 for ReduceFireDamageByRoll: its comment began '{ 1490.' and the check looks for an address of the form XXXX:XXXX (tools/match/readability.py ADDRESS). ovl12_e49's comment passed only because it cites ovl24:0E52 in its text. Write the routine's own address as `ovl12:1490.` at the start of its comment."
evidence = ["tools/match/readability.py", "src/OVL12.PAS#ReduceFireDamageByRoll"]

[[lesson]]
id = "global-rename-edits-other-units"
confidence = "V"
units = ["ovl12"]
tags = ["rename", "global", "tooling", "unit", "ownership"]
title = "make rename of a global used by another unit edits that unit's source (ds681C, set in ovl24)"
lesson = "`make rename OLD=ds681C NEW=LastDiceCount` changed src/OVL24.PAS (RollDiceCounted, which sets it), src/POOLVARS.PAS and re/dseg.toml as well as ovl12. A unit branch may not edit another unit's file (AGENTS rule 3), so it was reverted with `git checkout` for the three files and the renames.toml record removed, and ds681C keeps its dsXXXX name (its POOLVARS comment carries what is known, which satisfies R5). A global read in several units should be renamed by the orchestrator or the owner of the unit that sets it."
evidence = ["src/OVL24.PAS#RollDiceCounted", "src/POOLVARS.PAS#ds681C", "re/dseg.toml"]

[[lesson]]
id = "byte-function-result-to-word-parameter"
confidence = "V"
units = ["ovl12"]
tags = ["RollDice", "Byte", "Word", "parameter", "xor", "codegen", "call"]
title = "A Byte function result passed to a Word value parameter is zero-extended: xor ah, ah; push ax"
lesson = "ParalyzeAttackTargetFor2d8 (ovl12:1699) passes `RollDice(2, 8)`, a Byte function result, as the Word Duration of ParalyzeAttackTarget (ovl12:15EB). The original calls RollDice, then `xor ah, ah; push ax` (ovl12:16AD) before the call, and the match holds with the Word parameter. A constant 0 for the Byte parameter is `mov al, 0; push ax`."
evidence = ["src/OVL12.PAS#ParalyzeAttackTargetFor2d8", "re/symbols.toml#ovl12:1699"]

[[lesson]]
id = "times-16-byte-word-is-mov-cl-4"
confidence = "V"
units = ["ovl12"]
tags = ["shl", "Dec", "Word", "field", "codegen", "shift", "mul"]
title = "Dice * 16 compiles to mov cl, 4; shl ax, cl (the original's form); Dice shl 4 compiles to mov cx, 4"
lesson = "Dec(Affect^.Duration, Dice * 16) with Dice a Byte local matches the original's `xor ah, ah; mov cl, 4; shl ax, cl; sub word ptr es:[di+1], ax` (ovl12:176F). The probe tools/re/tp_idioms/ovl12/E61SHL.PAS shows that `Dice shl 4`, `Word(Dice) shl 4` and `(Dice shl 4) div 1` each give `mov cx, 4` (one byte longer), and that the multiplication by 16 is the spelling that the optimiser turns into the two-byte cl form. The first diff was a jmp one byte off, which is how the longer shift showed."
evidence = ["tools/re/tp_idioms/ovl12/E61SHL.PAS", "src/OVL12.PAS#DrainBloodFromCombatant", "re/symbols.toml#ovl12:176F"]

[[lesson]]
id = "or-chain-puts-else-part-first"
confidence = "V"
units = ["ovl12"]
tags = ["if", "or", "and", "layout", "codegen", "jump"]
title = "if A or B or C then X else Y lays out Y before X; the and-chain form lays out X first"
lesson = "The original of DrainBloodFromCombatant (ovl12:176F) tests `Mode <> 0` with jne to the non-blood code, `Who^.Flag10D = 0` with je to it, and `AttackTarget^.Flag10D <> 0` with jne to the blood code placed after it. That is what `if (Mode <> 0) or (Who^.Flag10D = 0) or (AttackTarget^.Flag10D = 0) then <non-blood> else <blood>` compiles to. The source `if (Mode = 0) and (...) and (...) then <blood> else <non-blood>` gave je to the next test and a different layout (the first diff at 179C). Write the negated or-chain when the original puts the blood code last."
evidence = ["src/OVL12.PAS#DrainBloodFromCombatant", "re/symbols.toml#ovl12:176F"]

[[lesson]]
id = "unread-call-result-stored-to-local"
confidence = "V"
units = ["ovl12"]
tags = ["function", "result", "discard", "local", "codegen", "call"]
title = "A function result the original never reads is stored to a local byte (Turn := res12_fn_2637(Who))"
lesson = "ovl12:176F calls res12_fn_2637(Who) and stores the Byte result at [bp-1] without ever testing it (`call; mov [bp-1], al`). A bare call is rejected by TP 6.0 (FNSTMT probe), and `if f(Who) <> 0 then ;` (ovl12:133F) has no store. The matched form is an assignment to a local Byte that is declared first (nearest bp) and never read; the local is named for what the value is, with a comment that it is not read."
evidence = ["src/OVL12.PAS#DrainBloodFromCombatant", "tools/re/tp_idioms/ovl12/FNSTMT.PAS", "re/symbols.toml#ovl12:176F"]

[[lesson]]
id = "map-entry-in-call-segment-word"
confidence = "V"
units = ["ovl12"]
tags = ["map", "entry", "lcall", "segment", "routine-boundary"]
title = "A map entry inside a far call's segment word is not a routine (ovl12:1758 in ovl12:1730)"
lesson = "The map listed ovl12:1758 (23 bytes, auto:far_call). Its bytes `b0 00` are the segment word of the `lcall 00B0:0052` to AddAffect at ovl12:1755 in ovl12_e60 (ovl12:1730), so the disassembly `mov al, 0; pop bp; retf 0Ah` at 1758 is a misreading of the call's tail. Once ovl12_e60 matched, `make match UNIT=ovl12 WRITE=1` removed the entry and corrected ovl12_e60 from 40 to 46 bytes. The declaration and the stub line were not removed by the tool: delete them by hand, or the unit does not compile (Undefined forward)."
evidence = ["src/OVL12.PAS#ovl12_e60", "re/symbols.toml#ovl12:1730"]
