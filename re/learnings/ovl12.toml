[[lesson]]
id = "map-entry-inside-routine-removed"
confidence = "V"
units = ["*"]
tags = ["map", "phantom", "far_call", "entry", "match-write"]
title = "A map entry in the middle of a routine (no prologue, pushes straddle it) is not a routine"
lesson = "The map listed ovl12:1307 as a routine (auto:far_call) and ovl12:12FB as a 12-byte routine. The bytes at 12FB push Who and 50, and the bytes at 1307 push Data and 14400 for the same TryAddAffect call, with no push bp at 1307 and no caller of 1307. Matched as one routine (AddHealingBlockAndHeal, 68 bytes), `make match WRITE=1` removed the 1307 entry; no separate Pascal can produce its bytes. Look for a prologue and for a call's argument pushes split across an entry before writing a `_fn_` routine."
