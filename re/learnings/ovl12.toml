# Lessons from unit ovl12 (TrainRewards). Leads with evidence, not matcher verdicts.

[[lesson]]
id = "case-loads-selector-once"
confidence = "V"
units = ["*"]
tags = ["case", "if", "or", "field", "codegen", "compare"]
title = "A case on a field loads it once; or-ed comparisons reload it"
lesson = "TP 6.0 loads the selector of a case statement once into AL and compares AL with each label (`mov al, byte ptr es:[di+10Ch]; cmp al, 7; je; cmp al, 6; je; cmp al, 8; jne`). The same test written as `if (F = 7) or (F = 6) or (F = 8) then Exit` compares the field in memory each time (`cmp byte ptr es:[di+10Ch], 7`), which does not match. ovl12:0058 matched only with the case form, and the match diff showed the two instructions side by side."
evidence = ["src/OVL12.PAS#DropFromFight", "re/symbols.toml#ovl12:0058"]

[[lesson]]
id = "inc-with-step-is-memory-add"
confidence = "V"
units = ["*"]
tags = ["Inc", "Dec", "add", "byte", "codegen"]
title = "Inc(X, N) on a byte global is one memory add"
lesson = "The matched forms are `Inc(ds6825, MoraleStep)` with MoraleStep = 5, which compiles to `add byte ptr [6825h], 5` with no load into AL, and `Inc(AttackRoll)` on a ShortInt, `inc byte ptr [6822h]` (ovl12:010D). The same Inc and Dec forms with a step match `sub byte ptr [6825h], 5` (ovl12:011D) and `add byte ptr [6822h], 2` (ovl12:013B). The plain assignment `X := X + N` was not probed; the Inc form is the one that matched."
evidence = ["src/OVL12.PAS#RaiseAttackAndMorale", "src/OVL12.PAS#BoostAttackAgainstTarget", "re/symbols.toml#ovl12:010D"]

[[lesson]]
id = "far-pointer-global-overlaps-table"
confidence = "V"
units = ["*"]
tags = ["global", "pointer", "absolute", "dseg", "AffectHandlers", "overlap"]
title = "A far-pointer global may overlap the next global; the matcher checks its second word by name"
lesson = "The original keeps a far pointer at DS:6826 whose segment word is DS:6828, where the AffectHandlers table starts (entry 0, which is not a handler). ovl12:013B stores the pointer with `mov [6826h], ax` and `mov [6828h], dx`. Declared as `AttackTarget: PCharacter` (dseg 6826, a name in re/dseg.toml), the second store is that variable plus 2, so the matcher maps it to DS:6828 and the routine matches without an `absolute` alias."
evidence = ["src/POOLVARS.PAS#AttackTarget", "re/dseg.toml#AttackTarget", "src/OVL12.PAS#BoostAttackAgainstTarget"]

[[lesson]]
id = "handler-shape-ignores-mode"
confidence = "V"
units = ["*"]
tags = ["AffectHandlers", "handler", "Mode", "retf", "frame"]
title = "An affect handler with the (Who, Affect, Mode) frame and no use of Mode"
lesson = "Three ovl12 routines take the TAffectHandler frame (retf 10: Who at +$C, Affect at +$8, Mode at +$6) and never read Mode or Affect: ovl12:010D, ovl12:011D and ovl12:013B. Declaring the parameters with the handler's full signature keeps the frame; the unused names are kept. Whether a given affect id calls them for apply, remove or both is a question for the hook lists, not for these bytes."
evidence = ["src/OVL12.PAS#RaiseAttackAndMorale", "src/OVL12.PAS#LowerAttackAndMorale", "src/OVL12.PAS#BoostAttackAgainstTarget", "src/POOLVARS.PAS#TAffectHandler"]

[[lesson]]
id = "signed-loop-index-cwde"
confidence = "V"
units = ["*"]
tags = ["for", "index", "ShortInt", "Byte", "cwde", "codegen"]
title = "A loop counter indexing an array is extended by its own type: ShortInt gives cwde, Byte gives xor ah, ah"
lesson = "The class loop of ovl12:0233 indexes ClassLevels (a ShortInt array) by its counter. With `I: Byte` each index is `mov al,[bp-3]; xor ah,ah` (two bytes); with `I: ShortInt` it is `mov al,[bp-3]; cwde` (one byte). The first build was four bytes longer, the first diff was the jmp to the epilogue at 0282, and the four index uses account for it. The same convention is in src/OVL04.PAS (RaiseDead, `I: ShortInt`). Declare a counter with the type the original uses, not with the range it runs over."
evidence = ["src/OVL12.PAS#TrainConstitution", "src/OVL04.PAS#RaiseDead", "re/symbols.toml#ovl12:0233"]

[[lesson]]
id = "bit-test-compare-with-zero"
confidence = "V"
units = ["*"]
tags = ["and", "bit", "Boolean", "codegen", "compare", "constant"]
title = "A bit test (X and mask) <> 0 compiles to and al, mask; or al, al; je"
lesson = "`if (DamageKind and KindCold) <> 0 then` matches ovl12:03E1 as `mov al,[DamageKind]; and al,2; or al,al; je`: the named constant KindCold (2) compiles like the literal, so the mask can be named."
evidence = ["src/OVL12.PAS#HalveColdDamage", "re/symbols.toml#ovl12:03E1"]

[[lesson]]
id = "div-by-power-of-two-is-mov-cl"
confidence = "V"
units = ["*"]
tags = ["div", "shr", "shift", "codegen", "constant", "cl"]
title = "X div 2^n compiles to mov cl, n; shr ax, cl, while X shr n compiles to mov cx, n; shr ax, cl"
lesson = "ovl12:0400 has `mov cl, 6; shr ax, cl` and `mov cl, 7; shr ax, cl` where the source has `div 64` and `div 128`. With `shr 6` or `shr 7` (any constant shift, Byte, Word or ShortInt operand, typed count or not) TP 6.0 emits `mov cx, n; shr ax, cl`, three bytes instead of two, and the first diff of the routine is the je after it. Write a power-of-two division as `div` when the original does, and let the match show which form it wrote. Probe tools/re/tp_idioms/ovl12/E11SHIFT.PAS (both shapes, and the shl form of `ShortInt(X) * 64`)."
evidence = ["src/OVL12.PAS#ComputerTakesOver", "tools/re/tp_idioms/ovl12/E11SHIFT.PAS", "re/symbols.toml#ovl12:0400"]

[[lesson]]
id = "signed-field-read-by-cast-cwde"
confidence = "V"
units = ["*"]
tags = ["ShortInt", "Byte", "cast", "cwde", "field", "codegen", "sign"]
title = "A Byte field read as ShortInt(field) sign-extends with cwde; read as Byte it is xor ah, ah"
lesson = "ovl12:0400 reads TCharacter.Side (+$10E, declared Byte) and multiplies it by 64: `mov al, es:[di+10Eh]; cwde; mov cl, 6; shl ax, cl`. The original reads the side signed. Writing `ShortInt(Who^.Side) * ControlSavedSideBit` on the Byte field reproduces the cwde and keeps POOLVARS's Byte declaration, so other routines that compare the field keep their code. The probe shows the same cwde for `ShortInt(X) * 64` on a Byte parameter."
evidence = ["src/OVL12.PAS#ComputerTakesOver", "tools/re/tp_idioms/ovl12/E11SHIFT.PAS", "src/POOLVARS.PAS#TCharacter"]

[[lesson]]
id = "less-or-equal-7f-is-the-cmp-form"
confidence = "V"
units = ["*"]
tags = ["compare", "Byte", "constant", "codegen", "jump"]
title = "`X <= $7F` compiles to cmp 7Fh; ja, while `X < $80` compiles to cmp 80h; jae"
lesson = "ovl12:0400 tests whether a character's B84 has its computer-run high bit clear: `if Who^.B84 <= $7F then`. TP 6.0 emits `cmp byte ptr es:[di+84h], 7Fh; ja skip`, which is the original's bytes. The same test written `< $80` emits `cmp ..., 80h; jae`, the same meaning but other bytes, so the written form decides the match. A named constant works in either form: `ComputerRunFlag - 1` gives the 7Fh form. The same holds for `X > $7F` (`if Data > StrengthKept - 1 then Exit` in ovl12:04BA, `cmp 7Fh; jbe` plus a jump to the epilogue) against `X >= $80`, which compiles to `cmp 80h`."
evidence = ["src/OVL12.PAS#ComputerTakesOver", "tools/re/tp_idioms/ovl12/E11SHIFT.PAS", "re/symbols.toml#ovl12:0400"]

[[lesson]]
id = "case-label-list-with-else-on-field"
confidence = "V"
units = ["*"]
tags = ["case", "else", "label", "field", "codegen"]
title = "A case with a label list and else on a field: one cmp/je per label, every arm jumps to the common end"
lesson = "`case AttackTarget^.Pad9E[$9F] of 10: Bonus := 1; 9, 12: Bonus := 2; 4: Bonus := 3; else Bonus := 0; end` matches ovl12:01C3: the selector is loaded once into AL, each label is a cmp with a je to its arm (a label list shares the arm, 9 and 12), the chain falls to the else arm, and each arm stores the local and jumps to the statement after the case."
evidence = ["src/OVL12.PAS#BoostFireAttackByTarget", "re/symbols.toml#ovl12:01C3"]

[[lesson]]
id = "separate-ifs-over-far-jumps"
confidence = "V"
units = ["*"]
tags = ["if", "else", "jump", "codegen", "nested"]
title = "A routine whose if tests jump past 127 bytes: separate ifs match, if/else-if does not"
lesson = "ovl12:07E0 first went `if Mode <> 0 then ... else if not Found and (count < limit) then ...`; the match differed at 083C (`je 0x85a` where the original has `je 0x857`). The original is three separate statements: `if Mode <> 0 then` (the removal), then `if Mode = 0 then if not Found then if count < limit then begin ... end`. A conditional jump over more than 127 bytes is compiled as a short `je` over a `jmp near`, so the listing shows pairs like `je +2; jmp 0907`. The nested form matched at 312 bytes. When a diff shows a jump target a few bytes off, check whether the source is an if/else chain."
evidence = ["src/OVL12.PAS#GiveAffectItem", "re/symbols.toml#ovl12:07E0"]

[[lesson]]
id = "name-table-index-base-row"
confidence = "V"
units = ["*"]
tags = ["array", "string", "index", "global", "compare", "dseg"]
title = "A table of 16-byte names indexed from 1: declare the row 0 as the index base"
lesson = "ovl12:0679 compares the attacked character's name (the string at offset 0 of TCharacter, passed as the record pointer) with rows 1..4 of a table at DS:0332. `ds0332: array[0..4] of string[15]` gives the 16-byte stride and the base address the code adds (`shl di, 4; add di, 332h`, the loop from 1 to 4). Row 0 is never read and is declared only so that the index base names DS:0332. The matcher maps the `dsXXXX` name to its original offset, so the declaration's place in POOLVARS does not matter."
evidence = ["src/OVL12.PAS#BoostAttackVsListedTarget", "src/POOLVARS.PAS#ds0332", "re/symbols.toml#ovl12:0679"]

[[lesson]]
id = "invented-map-entry-inside-routine"
confidence = "V"
units = ["*"]
tags = ["map", "boundary", "entry", "write", "tooling"]
title = "A map entry inside a routine that matched is removed by make match WRITE=1"
lesson = "The map invented ovl12_fn_06C8 (28 bytes, `auto:far_call`) inside ovl12:0679. Its first byte is in the middle of an instruction (`add di, 332h` at 06C7), so no caller can exist. When BoostAttackVsListedTarget (ovl12:0679) matched at 107 bytes, `make match UNIT=ovl12 WRITE=1` removed the entry and printed `lies inside ... removed from the map`. Do not write a stub for such an entry: drop its interface declaration and stub line in the source after the routine is written."
evidence = ["re/symbols.toml#ovl12:0679", "src/OVL12.PAS#BoostAttackVsListedTarget"]

[[lesson]]
id = "div-four-two-single-shifts"
confidence = "V"
units = ["*"]
tags = ["div", "shift", "byte", "codegen"]
title = "X div 4 on a Byte compiles to two single shifts, not to mov cl"
lesson = "`DamageAmount := DamageAmount - DamageAmount div 4` (ovl12:0A3D) matched with `mov al, [6818h]; xor ah, ah; shr ax, 1; shr ax, 1` for the quotient, then `sub ax, dx` and the byte store. The `mov cl, n; shr ax, cl` form seen for div 64 and div 128 (ovl12:0400) is therefore not the rule for every power of two: a quotient by 4 is two `shr ax, 1`. Measured here for n = 2, 6 and 7 only; n = 3 to 5 were not probed."
evidence = ["src/OVL12.PAS#ReduceDamageByQuarter", "re/symbols.toml#ovl12:0A3D", "re/learnings/ovl12.toml#div-by-power-of-two-is-mov-cl"]

[[lesson]]
id = "array-lower-bound-folds-into-displacement"
confidence = "V"
units = ["*"]
tags = ["array", "index", "dseg", "string", "codegen"]
title = "An array declared from 1 at DS:0382 adds 0372h: the lower bound is folded into the displacement"
lesson = "ovl12:0947 indexes eight 16-byte names with `for I := 1 to 8` as `shl di, 4; add di, 372h`, the same stride as ovl12:0679 (`add di, 332h` for rows of `ds0332: array[0..4]`). `ds0382: array[1..8] of string[15]` declared at DS:0382 (directly after ds0332, which ends at 0382) reproduces that displacement: the displacement 372h is the declared start 382h minus one row (16), the compiler's folding of the lower bound 1. The other lower bound was not probed."
evidence = ["src/OVL12.PAS#BoostAttackVsEightListed", "src/POOLVARS.PAS#ds0382", "re/symbols.toml#ovl12:0947"]

[[lesson]]
id = "if-not-boolean-call-tests-al"
confidence = "V"
units = ["*"]
tags = ["if", "not", "Boolean", "function", "codegen"]
title = "if not Boolean-function(...) then assignment tests AL with or al, al and jumps over the store"
lesson = "`if not res12_fn_2199(SelectedCharacter, $18, FoundAffect) then ds681E := 1;` (ovl12:0918) compiles to `call; or al, al; jne skip; mov byte [681Eh], 1`. The `not` costs no instruction: the jump is taken when the result is non-zero. The var Pointer local is pushed as `push ss; push di` (lea di, [bp-4])."
evidence = ["src/OVL12.PAS#LowerAttackRollByFour", "re/symbols.toml#ovl12:0918"]

[[lesson]]
id = "map-entry-at-displacement-byte"
confidence = "V"
units = ["*"]
tags = ["map", "boundary", "entry", "write", "tooling"]
title = "The map invents an entry on the displacement byte of an instruction inside a matched routine"
lesson = "ovl12:0AE5 (`auto:far_call`, 54 bytes) is the last byte of `mov al, byte ptr es:[di+112h]` (26 8A 85 12 01 at ovl12:0AE1) inside CoughStopsCasting (ovl12:0A65). `make match UNIT=ovl12 WRITE=1` removed it when CoughStopsCasting matched at 172 bytes. As with ovl12:06C8, no caller can enter there, and the source had to lose its interface declaration and stub line afterwards. Check the first byte of an invented entry against the instruction before it before any probe."
evidence = ["re/symbols.toml#ovl12:0A65", "src/OVL12.PAS#CoughStopsCasting"]

[[lesson]]
id = "div-16-byte-high-nibble"
confidence = "V"
units = ["ovl12"]
tags = ["div", "shr", "nibble", "shift", "codegen", "constant", "cl"]
title = "A Byte's high nibble written as div 16 compiles to mov cl, 4; shr ax, cl, where shr 4 gives mov cx, 4"
lesson = "`Who^.Side := Affect^.Data div 16` (CollapseAndChangeSide, ovl12:0B1B) matches the original's `xor ah, ah; mov cl, 4; shr ax, cl` at 0B53..0B57. `Affect^.Data shr 4` compiled to `mov cx, 4; shr ax, cl` and first differed at 0B55. This extends the div/shr rule above to n = 4; n = 2, 6 and 7 are in tools/re/tp_idioms/ovl12/E11SHIFT.PAS."
evidence = ["src/OVL12.PAS#CollapseAndChangeSide", "re/symbols.toml#ovl12:0B1B"]
