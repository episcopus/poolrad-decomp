notes = "matched at L2 (merged in 53ceaec after the nested-routine rule of c7265b6; note kept for history). Earlier: blocked (dec-16, 2026-10-12): the draft compiles to the original's bytes except the address fields of its nested PlaceBridge (CombatMap at 0BAB, 0BC8), compared byte for byte in the pre-entry region (held limit escalate-res06-20261012110841); the body differs only in CombatMap and RollDice addresses. Draft: procedure PlaceRiver; var Chance: Byte; Bridges: Byte; StartCol: ShortInt; Col, Row: ShortInt; Unused: Byte; procedure PlaceBridge(Row, Col: ShortInt); begin CombatMap^.Cells[Row, Col] := $34; CombatMap^.Cells[Row, Col + 1] := $35; Inc(Bridges); end; begin Chance := 0; Bridges := 0; if (BlockTerrainFlags and FlagRiverSometimes) <> 0 then Chance := $23; if (BlockTerrainFlags and FlagRiverOften) <> 0 then Chance := $4B; if RollDice(1, 100) <= Chance then begin Col := $22 - RollDice(5, 4); while (Col + 2) mod 7 > 0 do Dec(Col); StartCol := Col; for Row := 0 to MapLastRow do if Col <= MapLastCol then begin CombatMap^.Cells[Row, Col] := $32; CombatMap^.Cells[Row, Col + 1] := $33; if (RollDice(1, $14) = 1) or Odd(Bridges) then PlaceBridge(Row, Col); Inc(Col); end; if Bridges = 0 then begin Row := $C - RollDice(1, 9) + 4; Col := StartCol + Row; PlaceBridge(Row, Col); PlaceBridge(Row + 1, Col + 1); end; end; end;; renamed from ovl10_fn_0BDE (ovl10:0BDE draws a diagonal river (tiles 32h, 33h) down the wilderness combat map with 35 or 75 in 100 for the BlockTerrainFlags bits 20h and 10h, with bridge pieces (PlaceBridge) at random rows or at least one); auto:near_call; map dec-16 2026-10-12: ends 0D13 (was 16); 0BEE was mid-routine, entry deleted"
