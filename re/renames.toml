# Every rename of a routine or a global (tools/match/rename.py). `make rename APPLY=1`
# replaces old names still used in src/ by the new ones (after a merge).

[[rename]]
old = "res04_fn_0000"
new = "QuitGame"
kind = "routine"
why = "restores the sound mode, sets the saved video mode through INT 10h and calls Halt (0899:0000, whitepaper 5.8)"
date = "2026-10-11"

