[[rename]]
old = "ds49FA"
new = "AreaViewKind"
kind = "global"
why = "ovl26_e1 dispatches on it: case at ovl26:018C: 1 draws the 3D wall view (ovl29), 2..4 the map window (ovl27); ovl11_e1 sets 1 when an area loads, ovl03_fn_31B4 sets 2/3/4 with view type 3"
date = "2026-10-11"

[[rename]]
old = "ds3C76"
new = "MapBaseX"
kind = "global"
why = "byte table indexed by AreaViewKind, added to TGameState.MapX: ovl26:0006 and ovl26:023F read entries 2,3,4 = 0,13,26 (the map window pages in the 44-wide grid, ds3648); entry 1 is E"
date = "2026-10-11"

[[rename]]
old = "ds6DDC"
new = "MarkerFrame"
kind = "global"
why = "ovl26_e2 cycles it 0..5 ((x+1) mod 6 at ovl26:00AE) and draws the party marker with MarkerFrame mod 2 (mirror) and MarkerFrame div 2 + 9 (icon picture 9..11); ovl11_e1 resets it to 0"
date = "2026-10-11"

[[rename]]
old = "ovl26_e2"
new = "DrawPartyMarker"
kind = "routine"
why = "ovl26:0000: draws the party marker at its map window cell (the party position folded like ovl26_e1 clamps the window) with the 6-frame walk animation, then steps the frame; called right after the map window (res12_fn_2B5E, ovl26_e1) and from res12_fn_2B5E after ovl26_e1"
date = "2026-10-11"

[[rename]]
old = "ovl26_e1"
new = "ShowAreaView"
kind = "routine"
why = "ovl26:016D: shows the current area view: a case on the view kind draws either the 3D wall view (ovl29_e4/e1/e5, the ds0C26 wall id table and the special view codes) or the 5x5 map window (ovl27_e1) plus DrawPartyMarker; the resident view dispatcher res12_fn_27D9 calls it for view types 3 and 4, res12_fn_2B5E for the wilderness map screen"
date = "2026-10-11"

[[rename]]
old = "ovl26_fn_00C7"
new = "WallDesc2FromCode"
kind = "routine"
why = "ovl26:00C7: nested Byte function of ShowAreaView (static link push bp at ovl26:01D7): a case on the special view code ds6F69 maps codes 8 and 41 to 0 and anything else to 15, for wall view descriptor 2 (ds6A61)"
date = "2026-10-11"

[[rename]]
old = "ovl26_fn_00FB"
new = "WallDesc3FromCode"
kind = "routine"
why = "ovl26:00FB: nested Byte function of ShowAreaView (static link push bp at ovl26:01E3): a case on the special view code ds6F69 maps code 8 to 8 and anything else to 7, for wall view descriptor 3 (ds6A62)"
date = "2026-10-11"

[[rename]]
old = "ovl26_fn_012F"
new = "WallDesc4FromCode"
kind = "routine"
why = "ovl26:012F: nested Byte function of ShowAreaView (static link push bp at ovl26:01EF): a case on the special view code ds6F68 maps code 11 to 8, code 6 to 1 and anything else to 6, for wall view descriptor 4 (ds6A63)"
date = "2026-10-11"

[[rename]]
old = "ovl27_e1"
new = "DrawAreaView"
kind = "routine"
why = "draws the 5x5 grid of 3x3-tile area blocks around a map position into the 3D view window (ovl27:0000, matched): reads the block code from the area map, lets the nine fixed blocks override it while the game variables allow, and draws each block through ovl32_e2"
date = "2026-10-11"

[[rename]]
old = "ovl27_e2"
new = "DrawAdventureScreen"
kind = "routine"
why = "frames the three windows of the adventure screen with res09_fn_02E8 (ovl27:0207, matched): 3D view rows 1..15 cols 1..15, side window rows 1..15 cols 17..38, text area rows 17..22 cols 1..38, the standard Gold Box adventure layout"
date = "2026-10-11"

[[rename]]
old = "ds3648"
new = "AreaMap"
kind = "global"
why = "the area map: 36 rows x 44 columns of block codes at DS:3648, read as [row*44+col] minus one by DrawAreaView (ovl27:0000, matched), ovl10:1213 and ovl14:08B9 (ovl14 compares bytes with 'N'); rows 34 and 35 are all 'N' (0x4E) in the file image; ovl26_e1 clamps the view window to columns 0..39, rows 0..31"
date = "2026-10-11"

[[rename]]
old = "ds0C30"
new = "SpecialBlocks"
kind = "global"
why = "ten records of (Col, Row, Pic) at DS:0C30: DrawAreaView (ovl27:0000, matched) walks entries 1..9 and overrides the view block at (Col, Row) with Pic - 1 while the game variables allow; entry 0 is never read (in the image its bytes are the tail of the previous table)"
date = "2026-10-11"

[[rename]]
old = "ds49D2"
new = "GameVars"
kind = "global"
why = "far pointer at DS:49D2 to the game's word variables: ovl07:02E1 and ovl17:1C20 index it dynamically (shl ax,1; les; add di,ax), ovl26_e1 reads words 195 and 196 as the party's position on the area map, and DrawAreaView (ovl27:0000, matched) reads words 380, 396, 415, 416, 435 and 466 as gates for the fixed area blocks"
date = "2026-10-11"

[[rename]]
old = "ovl02_e1"
new = "CheckCodeWheel"
kind = "routine"
why = "ovl02:00FD: the copy protection check of whitepaper 5.12: up to three times it draws a random code wheel record (the runes as font characters, the path pattern) and reads the code word; a matching answer leaves at once, the third wrong one ends the program through QuitGame"
date = "2026-10-11"

[[rename]]
old = "res09_fn_0000"
new = "DrawWindowFrame"
kind = "routine"
why = "draws 4 corner tiles plus top/bottom/left/right edge tiles around LeftCol-1..RightCol+1, TopRow-1..BottomRow+1 with tiles FrameSet*3+114h..+2 through ovl34_e2; called by DrawWindow (03F1:02E8) after ClearWindow"
date = "2026-10-11"

[[rename]]
old = "res09_fn_0137"
new = "ClearWindow"
kind = "routine"
why = "fills the LeftCol..RightCol by TopRow..BottomRow rectangle with 0, by video hardware: scanline planes for 0, text cells through res06 for 1, four planes for 2, selected by VideoAdapter; called by DrawWindow (03F1:02E8)"
date = "2026-10-11"

[[rename]]
old = "res09_fn_02E8"
new = "DrawWindow"
kind = "routine"
why = "clears the window (ClearWindow), draws its frame (DrawWindowFrame) and centres Text on TopRow (res06_fn_0626); called for dialog boxes and screens from ovl01/02/03/04/05/06 and res12"
date = "2026-10-11"

[[rename]]
old = "ds4A1E"
new = "VideoAdapter"
kind = "global"
why = "ClearWindow (03F1:0137) dispatches on it: 0 fills scanline planes, 1 writes text cells, 2 fills four planes; the video hardware the game drives (POOL.CFG offers EGA/CGA/Tandy, mapping still open)"
date = "2026-10-11"

[[rename]]
old = "ovl11_e1"
new = "StartGame"
kind = "routine"
why = "ovl11:002D: the start-up loader the main program runs first (src/POOL.PAS: ovl11_e1 before the title and the copy protection); it allocates the game blocks, fills the cell tables, sets the game globals and reads the initial file (make match UNIT=ovl11)"
date = "2026-10-11"

[[rename]]
old = "ovl06_e2"
new = "AddInventoryItem"
kind = "routine"
why = "appends a clone of the item to the linked list at ds5D92^.Stock unless ovl19_e9 (Inventory) reports the list full (15 slots) and then shows OverLoaded; called from ovl05 (TreasureShare) and ovl06_fn_0361 (Buy), so it adds an item to the party inventory (ovl06:0239)"
date = "2026-10-11"

[[rename]]
old = "ovl06_fn_0030"
new = "ChooseShopItem"
kind = "routine"
why = "builds the Shop window (DrawWindow 'Shop'), rewrites each stock entry's Name into a 30-char name+Count field, runs the item picker ovl25_e4 ('Items: '/'Buy') over the list at ds6810 and returns the chosen entry in Head/Selected with the key in Action; called from ovl06_fn_0361 (Buy) (ovl06:0030)"
date = "2026-10-11"

[[rename]]
old = "ovl06_fn_0361"
new = "BuyItems"
kind = "routine"
why = "the Buy flow of the shop menu: loops on ChooseShopItem, pays from the pool (ovl19_e11) or the money (ovl21_e12 on ds67F4), adds the entry with AddInventoryItem and deducts via ovl21_e10/ovl21_e11, else shows Not enough Money.; called from ovl06_e1 on the 'B' menu key (ovl06:0361)"
date = "2026-10-11"

