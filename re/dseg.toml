[[global]]
offset = 0x3648
name = "AreaMap"
evidence = "the area map: 36 rows x 44 columns of block codes at DS:3648, read as [row*44+col] minus one by DrawAreaView (ovl27:0000, matched), ovl10:1213 and ovl14:08B9 (ovl14 compares bytes with 'N'); rows 34 and 35 are all 'N' (0x4E) in the file image; ovl26_e1 clamps the view window to columns 0..39, rows 0..31"

[[global]]
offset = 0x0C30
name = "SpecialBlocks"
evidence = "ten records of (Col, Row, Pic) at DS:0C30: DrawAreaView (ovl27:0000, matched) tests entries 1..9 for position; entries 1 and 2 have no case arm, so a match leaves the map code, and entries 3..9 replace it with Pic - 1 while the game variables allow (entry 6 always); entry 0 is never read (in the image its bytes are the tail of the previous table)"

[[global]]
offset = 0x49D2
name = "GameVars"
evidence = "far pointer at DS:49D2 to the game's word variables: ovl07:02E1 and ovl17:1C20 index it dynamically (shl ax,1; les; add di,ax), ShowAreaView and DrawPartyMarker (ovl26:016D, ovl26:0000, matched) read words 195 and 196 as the party's position on the area map and words 230, 251, 253 and 254 (+$1CC, +$1F6, +$1FA, +$1FC) for the wall view, and DrawAreaView (ovl27:0000, matched) reads words 380, 396, 415, 416, 435 and 466 as gates for the fixed area blocks. Type ^TGameVars (array of Word): the dynamic shl-ax-1 indexing fits a word array and not a record; with constant indices GameVars^[VarMapX] compiles to the same les di / es:[di+186h] a record field gave, so ovl26 and ovl27 both match against this one declaration (make match UNIT=ovl26, UNIT=ovl27, 2026-10-11)"

[[global]]
offset = 0x4A1E
name = "VideoAdapter"
evidence = "ClearWindow (03F1:0137) dispatches on it: 0 fills scanline planes, 1 writes text cells, 2 fills four planes; the video hardware the game drives; res08_init sets 1 for POOL.CFG E, 2 for T, 0 otherwise (042B:019B..01F9)"

[[global]]
offset = 0x6AAE
name = "ds6AAEWords"
evidence = "the 4-byte element table at DS:6AAE: the loader (ovl11_e1, ovl11:0369..0390) sets the two words of elements 2 and 3 to $FFFF (stride I*4: mov word [di+6AAEh] and [di+6AB0h]); its element 0 shares its first byte with DS:6AAE, the party row ovl29_e4 gets (ovl26_e1 passes ds6AAE). Declared as the alias array ds6AAEWords in src/POOLVARS.PAS because DS:6AAE itself is the party row byte"

