# DGROUP (the Turbo Pascal data segment) layout: names of DS offsets (SPEC 7.3, playbook 30).
# DGROUP is paragraph 0C7C of the load image ([V]: System_init does `mov dx,0C7Ch; mov ds,dx`).
# Initialised data ends with the image at paragraph 10BF; BSS follows; stack segment 14F2.
# Offsets below are DS-relative. tools/match/match.py resolves a Pascal global by this name
# (case-insensitive); a global named dsXXXX needs no entry (its name is its offset).
#
# System variables: Turbo Pascal 6.0's own layout (the compiled map of `make match`: System's first
# variable block, then Input, Output and the saved vectors after every unit's variables), placed in POOL
# by the offsets whitepaper 2.2 verified on our bytes (OvrHeapSize 43EE ... FileMode 442C; Input 8508,
# Output 8608, SaveInt00 8708). Every anchor agrees with one base per block.

